name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate.mjs
      - run: for f in app.js parts.js shapes.js view3d.js pdf.js airflow.js power.js guide.js estimate.js market.js; do node --check "$f"; done
      - run: node tools/test-estimate.mjs
      - run: node tools/test-market.mjs
      - run: node tools/test-power.mjs
