<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Rack Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mini Rack Planner: plan your 3D-printed 10-inch homelab rack, Lab Rax and more. Pick devices with existing mounts, design custom panels, check the airflow, view it in 3D and download a complete build pack.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: parts library left, the rack as a product shot on a stage in the middle, "your build" right */
:root{
  --bg:#F3F4F2; --panel:#FFFFFF; --card:#FFFFFF; --sunk:#F1F2F0; --stage:#FFFFFF;
  --ink:#16181B; --ink-2:#3A3F45; --muted:#6A6F76; --line:#E3E5E2; --line-2:#D8DBD7;
  --accent:#17824A; --accent-ink:#FFFFFF; --accent-soft:#E3F2E8; --accent-text:#11663A; --link:#17824A;
  --chip-on:#16181B; --chip-on-ink:#FFFFFF; --seg:#E8EAE7; --seg-on:#FFFFFF;
  --warn:#9A4A0B; --warn-soft:#FBEBDD; --shadow:0 1px 2px rgba(0,0,0,.08); --floor:rgba(0,0,0,.16);
  /* heat scale: air from room temperature (h0) to 25 °C above it (h6), one warm hue; hk-* are the text colours on it */
  --h0:#F6F1EC; --h1:#FCE1CB; --h2:#F8C29C; --h3:#F19A66; --h4:#C9531F; --h5:#A33F15; --h6:#7A2A0B; --hk-lo:#4A230C; --hk-hi:#FFFFFF;
  --air-in:#2563C9; --air-out:#B5461A; --air-ink:#FFFFFF;
  --f-ui:"Plus Jakarta Sans","Helvetica Neue",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-logo:"Audiowide","Plus Jakarta Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --panel:#1B1C1F; --card:#202124; --sunk:#232428; --stage:#2B2D31;
    --ink:#ECEDEE; --ink-2:#C2C5CA; --muted:#9A9EA4; --line:#2A2C30; --line-2:#3A3C41;
    --accent:#3CC27A; --accent-ink:#0E1A13; --accent-soft:#1E3428; --accent-text:#7EE0A8; --link:#4FD08A;
    --chip-on:#ECEDEE; --chip-on-ink:#141517; --seg:#232428; --seg-on:#34363B;
    --warn:#F2A065; --warn-soft:#38230F; --shadow:none; --floor:rgba(0,0,0,.45);
    --h0:#2C2825; --h1:#4A2D1D; --h2:#6E381C; --h3:#9B4721; --h4:#CB6230; --h5:#EC8C55; --h6:#F9BD93; --hk-lo:#F7E2D3; --hk-hi:#1A0E07;
    --air-in:#5B9CEB; --air-out:#F0915E; --air-ink:#0E1116;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --panel:#1B1C1F; --card:#202124; --sunk:#232428; --stage:#2B2D31;
  --ink:#ECEDEE; --ink-2:#C2C5CA; --muted:#9A9EA4; --line:#2A2C30; --line-2:#3A3C41;
  --accent:#3CC27A; --accent-ink:#0E1A13; --accent-soft:#1E3428; --accent-text:#7EE0A8; --link:#4FD08A;
  --chip-on:#ECEDEE; --chip-on-ink:#141517; --seg:#232428; --seg-on:#34363B;
  --warn:#F2A065; --warn-soft:#38230F; --shadow:none; --floor:rgba(0,0,0,.45);
  --h0:#2C2825; --h1:#4A2D1D; --h2:#6E381C; --h3:#9B4721; --h4:#CB6230; --h5:#EC8C55; --h6:#F9BD93; --hk-lo:#F7E2D3; --hk-hi:#1A0E07;
  --air-in:#5B9CEB; --air-out:#F0915E; --air-ink:#0E1116;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{min-height:64px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;margin-right:auto}
.brand-tx{display:flex;flex-direction:column;line-height:1.15}
.brand-tx small{font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--muted)}
@media (max-width:520px){.brand-tx small{display:none}}
.mark{width:30px;height:30px;border-radius:8px;background:#16181B;display:grid;place-items:center;flex:0 0 auto}
.top-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{height:32px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer}

/* layout */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "lib" "build";gap:0}
@media (min-width:860px){.app{grid-template-columns:340px minmax(0,1fr);grid-template-areas:"lib stage" "lib build"}}
@media (min-width:1280px){.app{grid-template-columns:400px minmax(0,1fr) 350px;grid-template-areas:"lib stage build"}
  .side-in{position:sticky;top:calc(65px + env(safe-area-inset-top,0px));max-height:calc(100vh - 65px);overflow:auto}}
.lib{grid-area:lib;background:var(--panel);border-right:1px solid var(--line);min-width:0}
.stagecol{grid-area:stage;min-width:0;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.build{grid-area:build;background:var(--panel);border-left:1px solid var(--line);min-width:0}
@media (max-width:859px){.lib,.build{border:0;border-top:1px solid var(--line)}}
.side-in{padding:20px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:860px){.side-in{padding:20px}}
h2.title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
h3.sub{font-size:14px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* library */
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.grouphead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 2px 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;gap:9px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer;min-width:0}
.card:hover{border-color:var(--line-2)}
.card.on{border-color:var(--accent)}
.thumb{height:72px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.card .nm{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.card .mt{font-size:12.5px;color:var(--muted);line-height:1.3}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.card .by{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{font-family:var(--f-mono);font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.badge.est{background:var(--warn-soft);color:var(--warn)}
.badge.hot{background:var(--warn);color:var(--panel)}
.card .ext{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);text-decoration:none;font-size:12px}
.card .ext:hover{border-color:var(--accent);color:var(--accent)}
.makebox{border:1px dashed var(--line-2);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;background:transparent;text-align:left;cursor:pointer;width:100%}
.makebox:hover{border-color:var(--accent)}
.plus{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:0 0 auto}

/* stage */
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.seg{display:flex;gap:4px;background:var(--seg);padding:4px;border-radius:999px}
.seg button{height:32px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;background:var(--panel)}
.stepper button{width:36px;height:36px;border:0;background:transparent;font-size:17px;cursor:pointer;border-radius:999px}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:34px;text-align:center;font-weight:700}
.stage{position:relative;border-radius:20px;background:var(--stage);border:1px solid var(--line);min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 12px 18px;overflow:hidden}
.stage .meas{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.example{position:absolute;top:14px;left:14px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
#view3d{position:absolute;inset:0}
#view3d canvas,#mk-3d canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.v3d-ui{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.v3d-ui .btn{background:var(--panel)}
.v3d-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}

/* rack (2D) */
.rack{display:grid;touch-action:pan-y;user-select:none}
.ulab{position:relative}
.ulab span{position:absolute;right:8px;display:flex;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rframe{position:relative}
.edge{position:relative;background:var(--frame)}
.edge.top{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.1)),var(--frame)} /* lit from above, like the 3D view */
.edge.top{border-radius:3px 3px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
/* the top ring is bevelled at 45° and mitred, so seen from the front its corners are cut off */
.edge.top::before,.edge.top::after{content:"";position:absolute;top:0;width:var(--bev);height:var(--bev);background:var(--stage);z-index:1}
.edge.top::before{left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.edge.top::after{right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.edge.bot{border-radius:0 0 6px 6px}
.handle{position:absolute;bottom:calc(100% - 1px);display:block;background:var(--frame);border-radius:3px 3px 0 0;box-shadow:inset 1px 1px 0 rgba(255,255,255,.07)}
.tp-band{position:absolute;bottom:100%;left:6%;right:6%;background:var(--acc);clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);filter:brightness(.9)}
.hexgrill{position:absolute;left:5%;top:17%;width:90%;height:68%;display:block} /* an <svg> keeps its 300×150 default unless sized explicitly */
.logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-logo);color:var(--acc);white-space:nowrap;line-height:1;text-shadow:0 0 1px #000,0 0 2px #000;pointer-events:none}
.foot{position:absolute;top:100%;width:11%;height:6px;background:var(--frame);border-radius:0 0 3px 3px;filter:brightness(.85)}
.post{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 22%,transparent 78%,rgba(0,0,0,.2)),var(--frame)}
.hole{position:absolute;left:50%;width:var(--hs);height:var(--hs);margin:calc(var(--hs) / -2) 0 0 calc(var(--hs) / -2);border-radius:50%;background:#070809;box-shadow:0 .5px 0 rgba(255,255,255,.1)}
.rack.brass .hole{box-shadow:0 0 0 calc(var(--hs) * .2) #C9A55A,inset 0 1px 1px rgba(0,0,0,.6)}
.bay{position:absolute;top:0;bottom:0;background:#0C0D0F}
.mount{position:absolute;inset:0}
.item{position:absolute;display:flex;align-items:center;gap:7px;background:var(--c);border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.3),0 1.5px 2px rgba(0,0,0,.45);cursor:grab;touch-action:none;overflow:hidden}
.item:hover{filter:brightness(1.07)}
.item.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.item.clash{outline:2px dashed var(--warn);outline-offset:1px}
.item.clash.sel{outline-style:solid}
.item.drag{z-index:3;opacity:.94;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.4)}
/* each part's face is an SVG drawn by shapes.js at the part's real size */
.item > svg.pf{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.item::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.1));pointer-events:none} /* light from above */
.tip{position:fixed;z-index:40;max-width:280px;padding:8px 11px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.35;display:flex;flex-direction:column;gap:1px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.tip b{font-weight:700}
.tip span{opacity:.82}
.tip .mono{font-family:var(--f-mono);font-size:11.5px}
.tip .warn{opacity:1;color:var(--warn-soft);font-weight:600}
.selbar .hint.warn{color:var(--warn)}
.dropghost{position:absolute;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:3px;pointer-events:none;z-index:4}
/* the top mount above the frame, and frame extras that show from the front */
.ap{position:absolute;bottom:100%;left:50%;pointer-events:none}
.ap svg{display:block;width:100%;height:100%}
.rack.airv .ap{opacity:.4}
.handle.flat{border-radius:2px 2px 0 0}
.hexgrill.lit g{fill:var(--acc)}
.hexgrill.lit{filter:drop-shadow(0 0 3px var(--acc))}
.logo.glow{text-shadow:0 0 1px #000,0 0 6px var(--acc),0 0 14px var(--acc)}
.corner-ks{position:absolute;left:10%;right:10%;top:22%;bottom:22%;display:flex;justify-content:center;align-items:stretch;gap:1.4%}
.corner-ks i{aspect-ratio:14.9/16.4;border-radius:1px;background:linear-gradient(#18191C 0 16%,#050506 16% 70%,#18191C 70%);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.corner-mx{position:absolute;left:20%;right:20%;top:24%;bottom:24%;border-radius:2px;background:radial-gradient(circle,#FF4D4D 0 30%,#3A1416 34% 46%,transparent 50%) 0 0/calc(100% / 32) 25%,#121314}
.eswitch{position:absolute;right:14%;top:50%;transform:translateY(-50%);border-radius:2px;background:#C8372D;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 2px #141518}
.sgrip{position:absolute;top:30%;height:24%;background:var(--frame);border-radius:4px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.caster{position:absolute;border-radius:50%;background:radial-gradient(circle,#9AA1A8 0 16%,#2A2C30 18% 30%,#1A1B1E 32%)}
.drawer{position:absolute;top:100%;left:2%;right:2%;background:var(--frame);border-radius:0 0 4px 4px;box-shadow:inset 0 2px 0 rgba(0,0,0,.45);display:grid;place-items:center}
.drawer i{width:22%;height:24%;border-radius:999px;background:var(--acc)}
.floor{height:18px;margin:4px 8% 0;border-radius:50%;background:radial-gradient(ellipse at center,var(--floor),transparent 70%)}

.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:56px}
.selbar .who{flex:1 1 200px;min-width:0;display:flex;flex-direction:column}
.selcolor{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.selcolor>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.selcolor input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--line-2);border-radius:8px;background:none;cursor:pointer}
.watts{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.watts input{width:78px}
.selbar .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);min-width:0}
.status{font-size:13px;color:var(--muted);min-height:20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.status .lnk{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-weight:600}
.unplaced{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.unplaced p{margin:0;color:var(--warn);font-weight:700;font-size:13px}
.unplaced .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unplaced .row span{flex:1;min-width:0}

/* rack settings */
.settings{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.set{display:flex;align-items:center;gap:8px}
.set>span,.set>label{font-size:12.5px;font-weight:600;color:var(--muted)}
.swatches{display:flex;gap:5px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.seg.small button{height:28px;padding:0 12px;font-size:13px}

/* build column */
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.prow .tick{width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;cursor:pointer}
.prow .tick[aria-pressed="true"]{border-color:var(--accent)}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .tx b{font-weight:600;line-height:1.25}
.prow .tx small{font-size:12px;color:var(--muted)}
.prow a{font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.prow .q{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.boxcard{padding:14px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;margin:0;font-size:13.5px}
.kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap}
.kv .note{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.kv a.buy{margin-left:8px;font-family:var(--f-ui);font-size:12.5px;font-weight:700;text-decoration:none}

        <button type="button" data-act="view" data-v="air" id="v-air">Airflow</button>
        <button type="button" data-act="view" data-v="3d" id="v-3d">3D view</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="muted" style="font-weight:600">Height</span>
        <div class="stepper"><button type="button" data-act="h-" id="h-minus" aria-label="Make the rack 1U lower">−</button><output id="h-out">5U</output><button type="button" data-act="h+" id="h-plus" aria-label="Make the rack 1U taller">+</button></div>
      </div>
    </div>
    <div class="stage" id="stage">
      <span class="example" id="example" hidden>Example layout · <button type="button" class="lnk" data-act="wizard">Set up your own</button></span>
      <div id="rackHost"></div>
      <div class="meas" id="meas"></div>
      <div id="view3d" hidden></div>
    </div>
    <div class="selbar" id="selbar"></div>
    <div id="unplaced"></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="settings" id="settings"></div>
  </section>

  <aside class="build" aria-label="Your build">
    <div class="side-in" id="build"></div>
  </aside>
</div>
<p class="foot-note" id="footer"></p>

<dialog class="maker" id="maker" aria-labelledby="mk-title">
  <div class="mk">
    <form class="mk-form" id="mk-form" method="dialog">
      <div class="mk-head"><h2 class="title" id="mk-title" style="font-size:19px">Custom part</h2><button type="button" class="iconbtn" data-act="maker-close" aria-label="Close" style="width:34px;height:34px">✕</button></div>
      <label for="mk-type">Part
        <select id="mk-type">
          <option value="blank">Blank panel</option>
          <option value="vent">Vent panel</option>
          <option value="keystone">Keystone panel</option>
          <option value="shelf">Shelf for a device</option>
          <option value="label">Label plate</option>
        </select>
      </label>
      <label for="mk-u">Height
        <select id="mk-u"></select>
      </label>
      <div id="mk-opts" style="display:flex;flex-direction:column;gap:12px"></div>
      <label for="mk-name">Name in the rack
        <input id="mk-name" type="text" maxlength="24" placeholder="E.g. Router shelf">
      </label>
      <p class="hint" id="mk-note"></p>
      <div class="mk-actions">
        <button type="button" class="btn primary" data-act="maker-add">Add to rack</button>
        <button type="button" class="btn" data-act="maker-stl">Download STL</button>
      </div>
    </form>
    <div class="mk-prev"><div id="mk-3d" style="position:absolute;inset:0"></div><span class="dims" id="mk-dims"></span></div>
  </div>
</dialog>

<dialog class="wizard" id="wizard" aria-labelledby="wz-title">
  <div class="wz">
    <div class="wz-top"><h2 class="title" id="wz-title">Set up a rack</h2><button type="button" class="iconbtn" data-act="wz-close" aria-label="Close">✕</button></div>
    <ol class="wz-steps" id="wz-steps"></ol>
    <div class="wz-body" id="wz-body"></div>
    <div class="wz-foot" id="wz-foot"></div>
  </div>
</dialog>

<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="lprev" id="lprev" aria-hidden="true" hidden></div>

<script src="parts.js"></script>
<script src="shapes.js"></script>
<script src="view3d.js"></script>
<script src="market.js"></script>
<script src="estimate.js"></script>
<script src="guide.js"></script>
<script src="pdf.js"></script>
<script src="airflow.js"></script>
<script src="power.js"></script>
<script src="app.js"></script>
</body>
</html>
